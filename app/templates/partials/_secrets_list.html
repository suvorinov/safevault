{% for secret in secrets %}
<div class="group hover:bg-gray-800/30 transition-colors p-4 flex items-stretch justify-between">
    <div class="flex-grow mr-4 overflow-hidden flex flex-col justify-center">
        <div class="flex items-center space-x-3 mb-1">
            <i class="fas fa-key text-xs text-gray-600 group-hover:text-green-500 transition-colors"></i>
            <span class="font-bold text-white text-lg tracking-wide">{{ secret.key }}</span>
        </div>
        <div class="bg-gray-900 rounded p-2 font-mono text-xs text-gray-400 border border-gray-800 overflow-x-auto whitespace-nowrap">
            {{ secret.value }}
        </div>
    </div>
    
    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-2">
         <button onclick="copyToClipboard('{{ secret.value }}')" class="text-gray-500 hover:text-white p-2 mt-7" title="Copy">
            <i class="fas fa-copy"></i>
        </button>
        <!-- ИСПРАВЛЕНО: Кнопка активна -->
        <button onclick="openDeleteModal('{{ secret.id }}')" class="text-gray-500 hover:text-red-500 p-2 mt-7" title="Delete">
            <i class="fas fa-trash"></i>
        </button>
    </div>
</div>
{% else %}
<div class="p-10 text-center text-gray-600">
    <i class="fas fa-shield-alt text-4xl mb-3"></i>
    <p>NO SECRETS STORED.</p>
</div>
{% endfor %}
